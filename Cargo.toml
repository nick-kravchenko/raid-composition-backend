[package]
name = "raid-composition-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.17.0"
actix-cors = "0.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
dotenvy = "0.15.7"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "chrono", "uuid", "ipnet", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
redis = { version = "1.7.1", features = ["tokio-comp"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
hmac = "0.13.0"
ipnet = "2.12.2"
maxminddb = "0.32.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
sha2 = "0.11.1"
subtle = "2.6.1"
url = "2.5.8"
